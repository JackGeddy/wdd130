<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            width: 100%;
            height: 100%;
            margin: 40px auto;
            overflow: hidden;
            
            
        }
        body:has(.bombmode:hover){
                background-image: url(../halloween/images/bomb.gif);
            }
        #formContainer{
            display: grid;
            grid-template-columns: 33% 34% 33%;
            /* grid-template-rows: repeat(1, 10fr); */
            background-color: white;
            width: 400px;
            margin: auto;
            position: relative;
            /* place-items: center; */
            border: 5px solid navy;
            border-radius: 50px;
            overflow: hidden;
            
        }
        img.jesus{
            width: 100%;
            height: 200px;
            grid-column: 1/4;
            grid-row: 1/2;
            position: relative;
            object-fit: cover;
        }
        .head{
            display: grid;
            text-align: center;
            grid-column: 1/4;
            grid-row: 1/2;
            position: absolute;
            align-self: center;
            justify-self: center;
            color: white;
            text-shadow: 3px 2px black;
        }
        h3{
            grid-column: 1/4;
            grid-row: 2/3;
            text-align: center;
            padding: 10px 5px 10px 5px;
        }
        #closeBtn{
            grid-column: 1/2;
            grid-row: 1/2;
            z-index: 100000000;
            align-self: left;
            width: fit-content;
            height: fit-content;
            margin: 30px;
            padding: 0px;
            /* position: relative; */
        }
        
        #myForm{
            grid-column: 1/4;
            grid-row: 3/4;
            display: grid;
            grid-gap: 20px;
            margin: auto;
            padding: 20px;
        }
        label{
            grid-column: 1/2;
            padding: 0px 0px 0px 10px;
        }
        input{
            grid-column: 2/4;
            margin: 0 10% 0 10%;
        }
        .them{
            grid-column: 2/4;
            /* padding: 0 10% 0 10%; */
        }
        .them label{
            padding: auto;
        }
        .them input{
            margin: 0 0 0 10%;
        }
        section input{
            margin: 0;
        }
        section:nth-of-type(1){
            grid-row: 5/6;
            grid-column: 1/4;
            text-align: center;
        }
        section:nth-of-type(2){
            grid-row: 6/7;
            grid-column: 1/4;
            text-align: center;
        }
        section:nth-of-type(3){
            grid-row: 7/8;
            grid-column: 1/4;
            text-align: center;
        }
        #books img{
            
            width: 76px;
        }
        #books{
            display: flex;
            flex-direction: row;
            gap: 5px;
            align-self: space-around;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <button type="button" id="closeBtn">X</button>
        <img class="jesus" src="images/jesus_feeds_5000.jpeg" alt="Jesus">
        <div class="head">
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div class="them">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
        <div id="books">
            <img src="images/book_of_mormon.webp" alt="bom">
            <img src="images/doctrine_and_covenants.webp" alt="dc">
            <img src="images/new_testament.webp" alt="nt">
            <img src="images/old_testament.webp" alt="ot">
            <img src="images/pearl_of_great_price.webp" alt="pogp">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>
<button class="bombmode"></button>
</body>

</html>
